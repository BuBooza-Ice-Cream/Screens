<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BuBooza Smithfield Screens</title>
<style>
@font-face{font-family:"Black Gumners";src:url("fonts/black-gumners-bold.woff") format("woff");font-weight:100 900;font-display:block}
@font-face{font-family:"Kollektif";src:url("fonts/kollektif.ttf") format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"Kollektif";src:url("fonts/kollektif-bold.ttf") format("truetype");font-weight:500 900;font-display:block}
/* Layout: fixed 1920×1080 stages scaled to fit; home view lists all three, #menu-ice / #menu-more / #promo show one fullscreen */
:root{
  --red:#A31D2B; --dark:#7E141F; --deep:#4F0C13; --cream:#F2DAAC; --milk:#FBF2E1; --pist:#9DB46A;
  --display:"Black Gumners",Impact,sans-serif;
  --body:"Kollektif",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--cream);font-family:var(--body)}
.home{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto;display:grid;gap:28px}
.home h1{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(24px,4vw,36px);color:var(--cream)}
.home p{margin:0;opacity:.8;max-width:65ch;line-height:1.5}
.item{display:grid;gap:10px}
.item header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.item h2{margin:0;font-size:18px;font-weight:700}
.item a{color:var(--cream);font-weight:500}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#000}
.solo .frame{position:fixed;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--red);color:var(--milk)}

/* shared stage pieces */
.wm{font-family:var(--display);font-size:64px;color:var(--cream);letter-spacing:1px;line-height:1}
.bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 72px;font-size:28px;color:var(--cream)}
.bar b{font-weight:700}
.allergen{position:absolute;left:0;right:0;bottom:84px;height:50px;display:flex;align-items:center;padding:0 72px;font-size:21px;background:rgba(0,0,0,.28);color:var(--cream);z-index:5}
.ph{font-family:var(--body);display:inline-block;padding:2px 12px;border:2px dashed currentColor;border-radius:8px;font-size:.7em;opacity:.75;vertical-align:middle}

/* menu screens */
.menu{display:grid;grid-template-columns:1fr 520px;height:946px}
.menu .main{padding:48px 72px 0;display:flex;flex-direction:column;gap:30px}
.menu .top{display:flex;justify-content:space-between;align-items:flex-end}
.menu h3{font-family:var(--display);font-weight:400;font-size:92px;margin:0;line-height:1.1;color:var(--milk)}
.menu .sub{font-size:30px;color:var(--cream);margin-top:22px}
.flav{flex:1;display:grid;grid-template-columns:1fr 1fr;align-content:space-evenly;gap:18px 64px;font-size:46px;padding-bottom:36px}
.flav div{display:flex;align-items:center;gap:20px;border-bottom:2px solid rgba(242,218,172,.25);padding-bottom:14px}
.dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.flav .star{margin-left:auto;font-size:22px;background:var(--cream);color:var(--dark);padding:6px 14px;border-radius:30px;font-weight:700;letter-spacing:1px}
.side{background:var(--cream);color:var(--dark);padding:56px 52px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.side h4{font-family:var(--display);font-weight:400;font-size:52px;line-height:1.2;margin:0;color:var(--red)}
.size{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:38px;line-height:1.1;font-weight:700;border-bottom:3px solid var(--red);padding-bottom:14px}
.size small{display:block;font-size:24px;font-weight:500;opacity:.7}
.price{font-family:var(--display);font-weight:400;font-size:52px;color:var(--red);font-variant-numeric:tabular-nums}
.note{font-size:26px;line-height:1.3}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.cols h5{font-family:var(--display);font-weight:400;font-size:52px;margin:0 0 18px;color:var(--cream)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:38px;padding:12px 0;border-bottom:2px solid rgba(242,218,172,.25)}
.row span:last-child{font-family:var(--display);color:var(--cream);font-variant-numeric:tabular-nums}
.row em{display:block;font-style:normal;font-size:24px;opacity:.75}

/* promo */
.slide{position:absolute;inset:0 0 134px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:0 110px;gap:60px;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide.draft{display:none} /* not shown until content is supplied */
.slide .k{font-size:34px;letter-spacing:6px;text-transform:uppercase;color:var(--cream);font-weight:700}
.slide h6{font-family:var(--display);font-weight:400;font-size:118px;line-height:1.22;margin:34px 0 34px;text-wrap:balance;color:var(--milk)}
.slide p{font-size:40px;line-height:1.35;margin:0;color:var(--cream);max-width:24ch}
.scoop{position:relative;width:620px;height:760px;justify-self:center}
.scoop .ball{position:absolute;left:50%;width:420px;height:400px;border-radius:50% 50% 46% 46%;transform:translateX(-50%)}
.scoop .cone{position:absolute;left:50%;top:400px;transform:translateX(-50%);width:0;height:0;border-left:190px solid transparent;border-right:190px solid transparent;border-top:360px solid #D9A35B}
.scoop .ball.b2{top:40px;width:380px;height:360px}
.scoop .ball.b1{top:250px;z-index:1}
.big{font-family:var(--display);font-size:300px;color:var(--cream);line-height:.85;text-align:center}
.big small{display:block;font-family:var(--body);font-size:44px;font-weight:700;letter-spacing:4px;margin-top:28px}
.pips{display:flex;gap:14px}
.pips i{width:16px;height:16px;border-radius:50%;background:var(--cream);opacity:.35}
.pips i.on{opacity:1}
/* characters */
.scoop{animation:bob 2.6s ease-in-out infinite}
.scoop .ball.b2{animation:wob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.face{position:absolute;left:50%;top:50%;width:220px;height:130px;transform:translate(-50%,-50%);animation:look 7s ease-in-out infinite}
.b2 .face{top:40%}
.face i{position:absolute;display:block}
.eye{top:0;width:38px;height:54px;background:#2A0A0E;border-radius:50%;animation:blink 4.5s infinite}
.eye::after{content:"";position:absolute;left:9px;top:9px;width:13px;height:13px;border-radius:50%;background:#fff}
.eye.l{left:36px}.eye.r{right:36px;animation-delay:.05s}
.cheek{top:70px;width:46px;height:24px;border-radius:50%;background:rgba(214,51,92,.5)}
.cheek.l{left:0}.cheek.r{right:0}
.mouth{left:50%;top:72px;width:72px;height:38px;margin-left:-36px;border:9px solid #2A0A0E;border-top:0;border-radius:0 0 72px 72px;box-sizing:border-box}
.face.wink .eye.r{height:12px;top:22px;border-radius:12px;animation:none}
.face.wink .eye.r::after{display:none}
.face.o .mouth{width:44px;height:50px;margin-left:-22px;border:9px solid #2A0A0E;border-radius:50%;animation:ooh 2.6s ease-in-out infinite}
.drip{position:absolute;bottom:-34px;width:36px;height:70px;border-radius:0 0 22px 22px;background:inherit;transform-origin:50% 0;animation:drip 3.4s ease-in-out infinite}
.drip.d1{left:28%}.drip.d2{left:62%;height:50px;animation-delay:1.3s}
.mini{position:relative;width:124px;height:152px}
.mini .scoop{position:absolute;left:0;top:0;transform:scale(.2);transform-origin:0 0}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -20px}}
@keyframes wob{0%,100%{rotate:-3deg}50%{rotate:3deg}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes look{0%,30%,100%{translate:0 0}40%,55%{translate:-14px 0}65%,80%{translate:12px 0}}
@keyframes ooh{0%,100%{scale:1}50%{scale:1.15}}
@keyframes drip{0%,100%{transform:scaleY(.35)}60%{transform:scaleY(1)}}
/* screen 2 steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.step{background:rgba(242,218,172,.08);border:3px solid rgba(242,218,172,.25);border-radius:36px;padding:30px 40px 34px;display:flex;flex-direction:column;gap:16px}
.step .n{font-family:var(--display);font-size:84px;line-height:.9;color:var(--cream)}
.step h5{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:0;color:var(--milk)}
.step p{font-size:29px;line-height:1.3;margin:0;color:var(--cream)}
.opt{display:flex;justify-content:space-between;align-items:baseline;font-size:33px;border-bottom:2px solid rgba(242,218,172,.25);padding-bottom:8px}
.opt b{font-family:var(--display);font-weight:400;color:var(--cream);font-variant-numeric:tabular-nums}
.split{display:flex;justify-content:space-between}
.split div{text-align:center;font-size:28px;font-weight:700}
.split i{display:block;width:92px;height:92px;border-radius:50%;margin:0 auto 10px;border:5px solid var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chips span{font-size:28px;font-weight:700;background:var(--cream);color:var(--dark);padding:8px 20px;border-radius:40px}
.step hr{border:0;border-top:2px solid rgba(242,218,172,.25);margin:0;width:100%}
/* screen 2 cards */
.menu .main{height:100%;box-sizing:border-box}
.cards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-bottom:48px}
.card{background:rgba(242,218,172,.08);border:3px solid rgba(242,218,172,.25);border-radius:36px;padding:40px 44px 36px;display:flex;flex-direction:column;gap:30px}
.card .split i{width:108px;height:108px}
.card h5{font-family:var(--display);font-weight:400;font-size:52px;line-height:1.3;margin:14px 0 0;color:var(--milk);text-wrap:balance}
.card p{font-size:32px;line-height:1.3;margin:0;color:var(--cream)}
.drinks{display:grid;gap:18px}
.drinks div{display:grid;gap:2px;border-bottom:2px solid rgba(242,218,172,.2);padding-bottom:12px}
.drinks b{font-size:36px;color:var(--milk)}
.drinks span{font-size:26px;color:var(--cream);opacity:.85}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid rgba(242,218,172,.3);padding-top:18px;font-size:30px;color:var(--cream)}
.foot b{font-family:var(--display);font-weight:400;font-size:72px;line-height:1;color:var(--milk)}
/* screen 3 video */
.slide.vid{display:block;padding:0;background:#000}
.slide.vid video{width:100%;height:100%;object-fit:cover;display:block}
.vph{height:100%;display:grid;place-items:center;font-size:48px;color:var(--cream);border:6px dashed rgba(242,218,172,.4);box-sizing:border-box}
/* Abu Hassan walker */
.walker{position:absolute;left:0;bottom:30px;width:260px;height:416px;z-index:20;pointer-events:none;transform:translateX(-340px);visibility:hidden}
.walker svg{width:100%;height:100%;overflow:visible}
.walker svg *{transform-box:fill-box}
.walker.go{visibility:visible;animation:across 16s linear forwards}
.walker.go .guy{animation:waddle .45s ease-in-out infinite alternate;transform-origin:50% 100%}
.walker.go .leg.l{animation:step .45s ease-in-out infinite alternate}
.walker.go .leg.r{animation:step .45s ease-in-out infinite alternate-reverse}
.walker.go .arm.l{transform-origin:100% 0;animation:swing .45s ease-in-out infinite alternate}
.walker.go .arm.r{transform-origin:0 0;animation:swing .45s ease-in-out infinite alternate-reverse}
.walker.go .head{transform-origin:50% 100%;animation:nod .9s ease-in-out infinite alternate}
.bubble{position:absolute;left:170px;top:-30px;background:var(--milk);color:var(--dark);font:700 32px/1.2 var(--body);padding:16px 26px;border-radius:28px;white-space:nowrap;opacity:0;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.bubble::after{content:"";position:absolute;left:30px;bottom:-16px;border:10px solid transparent;border-top:14px solid var(--milk);border-bottom:0}
.walker.go .bubble{animation:bub 16s forwards}
@keyframes across{0%{transform:translateX(-340px)}42%{transform:translateX(830px)}58%{transform:translateX(830px)}100%{transform:translateX(2260px)}}
@keyframes waddle{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-8px)}}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes swing{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes nod{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes bub{0%,43%{opacity:0;scale:.6}46%,56%{opacity:1;scale:1}58%,100%{opacity:0;scale:.6}}
.item button{font:500 15px var(--body);background:var(--cream);color:var(--dark);border:0;border-radius:20px;padding:6px 14px;cursor:pointer}
.item button:focus-visible,.item a:focus-visible{outline:3px solid var(--milk);outline-offset:2px}
.item .acts{display:flex;gap:14px;align-items:center}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.scoop,.scoop *{animation:none!important}}
</style>
</head>
<body>


<div id="app"></div>

<template id="t-menu-ice">
  <div class="stage">
    <div class="menu">
      <div class="main">
        <div class="top">
          <div><h3>N-ice cream</h3><div class="sub">Handmade Middle Eastern ice cream</div></div>

          <div><i class="dot" style="background:#5A3424"></i>Chocolate</div>
          <div><i class="dot" style="background:#F2A65A"></i>Apricot</div>
          <div><i class="dot" style="background:#F6B93B"></i>Mango</div>

          <div style="opacity:.6;font-size:32px">Flavours rotate daily</div>

      <aside class="side">

<template id="t-menu-more">
  <div class="stage" style="background:var(--dark)">
    <div class="menu" style="grid-template-columns:1fr">
      <div class="main">
        <div class="top">
          <div><h3>Meet the menu</h3><div class="sub">Handmade Middle Eastern ice cream and drinks</div></div>
          <div class="wm">BuBooza</div>
        </div>
        <div class="cards">
          <div class="card">
            <h5>Cup or cone</h5>
            <p>Choose up to 4 flavours. We split your serve evenly between them.</p>
            <div class="split">
              <div><i style="background:#9DB46A"></i>1</div>
              <div><i style="background:conic-gradient(#9DB46A 0 50%,#FFF6E6 0)"></i>2</div>
              <div><i style="background:conic-gradient(#9DB46A 0 33.3%,#FFF6E6 0 66.6%,#D6335C 0)"></i>3</div>
              <div><i style="background:conic-gradient(#9DB46A 0 25%,#FFF6E6 0 50%,#D6335C 0 75%,#F6B93B 0)"></i>4</div>
            </div>
            <div class="foot"><span>One size</span><b>$10</b></div>
          </div>
          <div class="card">
            <h5>The Shake of BuBooza</h5>
            <p>Your chosen flavour, blended thick. Pick a sauce on top and add cream if you like.</p>
            <div class="chips"><span>Chocolate sauce</span><span>Strawberry sauce</span><span>+ Cream on top</span></div>
            <div class="foot"><span>Regular</span><b>$14</b><span>Large</span><b>$17</b></div>
          </div>
          <div class="card">
            <h5>The Sharabs</h5>
            <p>Traditional Lebanese iced drinks, served frosty.</p>
            <div class="drinks">
              <div><b>Jallab</b><span>Grape molasses, dates and rose water</span></div>
              <div><b>Rose</b><span>Fragrant rose syrup over ice</span></div>
              <div><b>Limonada</b><span>Lebanese lemonade</span></div>
            </div>
            <div class="foot"><span>Any Sharab</span><b>$7</b></div>
          </div>
        </div>
      </div>
    </div>
    <div class="bar" style="background:var(--deep)"><span><b>Ask to taste</b></span><span>Open 7 days · 11am – 11pm</span></div>
  </div>
</template>

<template id="t-promo">
  <div class="stage">
    <div class="slide draft" style="background:var(--cream);color:var(--dark)">
      <div><div class="k" style="color:var(--red)">Limited time</div><h6 style="color:var(--red)">Promotion title</h6><p style="color:var(--dark)">Offer details <span class="ph">TBC</span>. Ends <span class="ph">date</span>.</p></div>

    </div>
    <div class="slide">
      <div><div class="k">678A The Horsley Dr</div><h6>Now open in Smithfield</h6><p>Our first official BuBooza store. Open every day, 11am to 11pm.</p></div>
      <div class="scoop"><i class="ball b2" style="background:#9DB46A" data-face="happy"></i><i class="ball b1" style="background:#FFF6E6"></i><i class="cone"></i></div>
    </div>
    <div class="slide" style="background:var(--cream);color:var(--dark)">
      <div><div class="k" style="color:var(--red)">The original</div><h6 style="color:var(--red)">Kashta</h6><p style="color:var(--dark)">Clotted-cream ice cream, stretched and folded by hand, finished with pistachio.</p></div>
      <div class="scoop"><i class="ball b1" style="background:#FFF6E6;top:180px;box-shadow:0 0 0 8px var(--red)" data-face="wink"></i><i class="cone"></i></div>
    </div>
    <div class="slide" style="background:var(--dark)">
      <div><div class="k">Weddings · birthdays · corporate</div><h6>BuBooza at your event</h6><p>Live ice cream service for 120 guests and up. Enquire at bubooza.com/bookings</p></div>
      <div class="big">120+<small>GUESTS</small></div>
    </div>
    <div class="slide">
      <div><div class="k">Take-home · 500mL · $25</div><h6>HaBooza</h6><p>Flavour combos picked by our team. Take a HaBooza to your habibi.</p></div>
      <div class="scoop"><i class="ball b2" style="background:#D6335C" data-face="o"></i><i class="ball b1" style="background:#F6B93B"></i><i class="cone"></i></div>

    <div class="bar"><span class="wm" style="font-size:40px">BuBooza</span><span class="pips"></span><span>@buboozaicecream</span></div>
  </div>
</template>

<template id="t-walker">
  <div class="walker" aria-hidden="true">
    <div class="bubble"></div>
    <svg viewBox="0 0 200 320">
      <ellipse cx="100" cy="312" rx="62" ry="8" fill="rgba(0,0,0,.25)"/>
      <g class="guy">
        <g class="leg l"><rect x="72" y="232" width="24" height="62" fill="#26201F"/><ellipse cx="80" cy="298" rx="22" ry="12" fill="#141010"/></g>
        <g class="leg r"><rect x="104" y="232" width="24" height="62" fill="#26201F"/><ellipse cx="120" cy="298" rx="22" ry="12" fill="#141010"/></g>
        <rect x="52" y="146" width="96" height="98" rx="24" fill="#FAF7F1"/>
        <rect x="54" y="212" width="92" height="9" fill="#E6DFD2"/>
        <path d="M84 148 L100 166 L116 148" fill="none" stroke="#E6DFD2" stroke-width="4"/>
        <g fill="#D9D1C3"><circle cx="86" cy="176" r="3.5"/><circle cx="114" cy="176" r="3.5"/><circle cx="86" cy="198" r="3.5"/><circle cx="114" cy="198" r="3.5"/></g>
        <g class="arm l">

<script>
// Abu Hassan crosses Screen 1 → 2 → 3 (mounted left to right), one screen at a time, clock-synced across TVs
const CROSS_EVERY=600;   // seconds between crossings (10 min). Set TEST to true to cross every 60s.
const TEST=false;
const LEG=16;            // seconds per screen
const ORDER=["menu-ice","menu-more","promo"];
const MSG={"menu-ice":"Ahlan! Pick up to 4 flavours","menu-more":"Try the Jallab","promo":"Take a HaBooza to your habibi"};
const ALLERGEN="Our products may contain or come into contact with milk, eggs, tree nuts (incl. pistachio, almond), peanuts, gluten and soy. Please tell staff about any allergies before ordering.";
function walk(f){const w=f.querySelector(".walker");if(!w)return;w.classList.remove("go");void w.offsetWidth;w.classList.add("go");}
function schedule(id,f){const P=TEST?60:CROSS_EVERY,off=ORDER.indexOf(id)*LEG;
  const k=()=>Math.floor((Date.now()/1000-off)/P);let last=k();
  timers.push(setInterval(()=>{const now=k(),into=((Date.now()/1000-off)%P+P)%P;
    if(now!==last&&into<3){last=now;walk(f);}},250));}
function crossNow(frames){ORDER.forEach((id,i)=>timers.push(setTimeout(()=>walk(frames[id]),i*LEG*1000)));}
const SCREENS=[
  {id:"menu-ice",name:"Screen 1 · Ice cream menu"},
  {id:"menu-more",name:"Screen 2 · Meet the menu"},
  {id:"promo",name:"Screen 3 · Promotions & videos"}
];
const app=document.getElementById("app");
let timers=[];
function fit(){document.querySelectorAll(".frame").forEach(f=>{const s=f.querySelector(".stage");const k=Math.min(f.clientWidth/1920,f.clientHeight/1080);s.style.transform=`translate(${(f.clientWidth-1920*k)/2}px,${(f.clientHeight-1080*k)/2}px) scale(${k})`;});}
function mount(id){const f=document.createElement("div");f.className="frame";f.appendChild(document.getElementById("t-"+id).content.cloneNode(true));f.querySelectorAll("[data-face]").forEach(b=>b.insertAdjacentHTML("beforeend",`<span class="face ${b.dataset.face}"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></span>`));
  f.querySelectorAll(".scoop .ball.b1").forEach(b=>b.insertAdjacentHTML("beforeend",'<i class="drip d1"></i><i class="drip d2"></i>'));
  const w=document.getElementById("t-walker").content.firstElementChild.cloneNode(true);
  w.addEventListener("animationend",e=>{if(e.animationName==="across")w.classList.remove("go");});
  w.querySelector(".bubble").textContent=MSG[id];
  const st=f.querySelector(".stage");st.appendChild(w);
  st.insertAdjacentHTML("beforeend",`<div class="allergen">${ALLERGEN}</div>`);
  if(id==="promo")rotate(f);return f;}
// Promo loop: 8s per slide; a slide with a <video> plays to the end, then moves on
function rotate(f){const sl=[...f.querySelectorAll(".slide:not(.draft)")],bar=f.querySelector(".pips");
  bar.innerHTML=sl.map(()=>"<i></i>").join("");const pp=bar.children;let i=-1;
  function next(){
    if(i>=0){sl[i].classList.remove("on");pp[i].classList.remove("on");const o=sl[i].querySelector("video");if(o)o.pause();}
    i=(i+1)%sl.length;sl[i].classList.add("on");pp[i].classList.add("on");
    const v=sl[i].querySelector("video");
    if(v){let done=false;const go=()=>{if(done)return;done=true;next();};v.onended=go;v.currentTime=0;v.play().catch(()=>{});
      timers.push(setTimeout(go,v.duration?v.duration*1000+800:60000));}
    else timers.push(setTimeout(next,8000));}
  next();}
function render(){
  timers.forEach(clearInterval);timers=[];app.innerHTML="";
  const h=location.hash.slice(1);
  if(SCREENS.some(s=>s.id===h)){document.body.classList.add("solo");const f=mount(h);app.appendChild(f);schedule(h,f);
    try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  }else{
    document.body.classList.remove("solo");
    const w=document.createElement("div");w.className="home";
    w.innerHTML=`<h1>BuBooza Smithfield screens</h1><p>Open each screen's link on its TV, left to right: Screen 1, 2, 3. Abu Hassan crosses all three every 10 minutes, one screen at a time.</p><div class="item"><div class="acts"><button type="button" id="cross-now">Play crossing now</button></div></div>`;
    const frames={};
    SCREENS.forEach(s=>{const it=document.createElement("section");it.className="item";
      it.innerHTML=`<header><h2>${s.name}</h2><span class="acts"><a href="#${s.id}">Open fullscreen</a></span></header>`;
      const f=mount(s.id);frames[s.id]=f;it.appendChild(f);w.appendChild(it);schedule(s.id,f);});
    w.querySelector("#cross-now").addEventListener("click",()=>crossNow(frames));
    app.appendChild(w);
  }
  requestAnimationFrame(fit);
}
addEventListener("hashchange",render);addEventListener("resize",fit);
render();
</script>

<script>
// Offline: keep a cached copy so the TVs keep running if the internet drops
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
// Pick up menu updates: reload every 30 min when online
setInterval(()=>{if(navigator.onLine)location.reload();},30*60*1000);
</script>
